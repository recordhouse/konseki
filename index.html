<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070c13" />
    <meta name="description" content="조용한 일본 주택가를 배경으로 한 Three.js 1인칭 미행 게임" />
    <title>Konseki — 밤의 흔적</title>
  </head>
  <body>
    <main id="game" aria-label="Konseki 3D 게임 화면">
      <canvas id="game-canvas"></canvas>

      <section id="start-screen" class="overlay visible" aria-live="polite">
        <div class="start-card">
          <p class="eyebrow">THREE.JS FIRST PERSON TAILING</p>
          <h1>夜の痕跡 <span>밤의 흔적</span></h1>
          <p class="intro">조용한 주택가에서 목표를 놓치지 마세요.<br />너무 가까워도, 너무 멀어도 안 됩니다.</p>
          <button id="start-button" type="button">추적 시작</button>
          <div class="controls">
            <span><kbd>WASD</kbd> 천천히 걷기</span>
            <span><kbd>마우스</kbd> 시점 이동</span>
            <span><kbd>R</kbd> 다시 시작</span>
            <span><kbd>ESC</kbd> 일시 정지</span>
          </div>
          <p id="asset-status" class="asset-status">V4 캐릭터를 준비하는 중…</p>
        </div>
      </section>

      <section id="result-screen" class="overlay" aria-live="assertive">
        <div class="result-card">
          <p id="result-kicker" class="eyebrow">RESULT</p>
          <h2 id="result-title">추적 종료</h2>
          <p id="result-message"></p>
          <button id="restart-button" type="button">다시 추적</button>
        </div>
      </section>

      <aside class="hud" aria-label="미행 상태">
        <div class="objective">
          <span class="objective-label">현재 목표</span>
          <strong id="objective-text">타겟과 거리를 유지하세요</strong>
        </div>
        <div class="meters">
          <div class="meter-row">
            <div class="meter-label"><span>거리</span><output id="distance-value">-- m</output></div>
            <div class="meter-track distance"><i id="distance-bar"></i></div>
          </div>
          <div class="meter-row">
            <div class="meter-label"><span>의심</span><output id="suspicion-value">0%</output></div>
            <div class="meter-track suspicion"><i id="suspicion-bar"></i></div>
          </div>
        </div>
        <div id="status-pill" class="status-pill safe"><i></i><span>안전 거리</span></div>
      </aside>

      <div class="crosshair" aria-hidden="true"><i></i><i></i></div>
      <div class="vignette" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
